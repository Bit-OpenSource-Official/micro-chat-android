name: OVE.rs Android release

on:
  push:
    branches:
      - "release/**"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build OVE.rs release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          version="${ref#release/}"
          if [[ -z "${version}" || "${version}" == "${ref}" ]]; then
            echo "Expected branch name release/VERSION, got ${ref}" >&2
            exit 1
          fi
          echo "name=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "code=$((100000 + GITHUB_RUN_NUMBER))" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install legacy ARMv6 C toolchain
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/android-ndk-r14b.zip" \
            https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip
          echo "0ecc2017802924cf81fffc0f51d342e3e69de6343da892ac9fa1cd79bc106024  ${RUNNER_TEMP}/android-ndk-r14b.zip" \
            | sha256sum -c -
          unzip -q "${RUNNER_TEMP}/android-ndk-r14b.zip" -d "${RUNNER_TEMP}"
          echo "ANDROID_NDK_R14_HOME=${RUNNER_TEMP}/android-ndk-r14b" >> "${GITHUB_ENV}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_B64}" || -z "${RELEASE_STORE_PASSWORD}" || \
                -z "${RELEASE_KEY_ALIAS}" || -z "${RELEASE_KEY_PASSWORD}" ]]; then
            echo "Android release signing secrets are required" >&2
            exit 1
          fi
          printf "%s" "${ANDROID_KEYSTORE_B64}" | base64 -d > micromsg.keystore

          echo "RELEASE_STORE_FILE=micromsg.keystore" >> "${GITHUB_ENV}"
          echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Check and build universal/platform APKs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make native-libs release-check release-apks \
            VERSION="${{ steps.version.outputs.name }}" \
            VERSION_CODE="${{ steps.version.outputs.code }}" \
            RELEASE_TAG="${{ steps.version.outputs.tag }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ove-rs-${{ steps.version.outputs.name }}-release
          path: |
            release/ove-rs-${{ steps.version.outputs.name }}-all.apk
            release/ove-rs-${{ steps.version.outputs.name }}-armv6.apk
            release/ove-rs-${{ steps.version.outputs.name }}-armv7.apk
            release/ove-rs-${{ steps.version.outputs.name }}-arm64.apk
            release/ove-rs-${{ steps.version.outputs.name }}-x86_64.apk
            release/ove-rs-${{ steps.version.outputs.name }}.xapk
            release/update.json
            release/SHA256SUMS
            release/release-notes.md
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: OVE.rs ${{ steps.version.outputs.name }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          universal="release/ove-rs-${RELEASE_VERSION}-all.apk"
          armv6="release/ove-rs-${RELEASE_VERSION}-armv6.apk"
          armv7="release/ove-rs-${RELEASE_VERSION}-armv7.apk"
          arm64="release/ove-rs-${RELEASE_VERSION}-arm64.apk"
          x86_64="release/ove-rs-${RELEASE_VERSION}-x86_64.apk"
          xapk="release/ove-rs-${RELEASE_VERSION}.xapk"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            for stale_name in "ove-rs-${RELEASE_VERSION}-universal.apk"; do
              stale_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
                --jq ".assets[] | select(.name == \"${stale_name}\") | .id")"
              if [[ -n "${stale_id}" ]]; then
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${stale_id}"
              fi
            done
            gh release upload "${RELEASE_TAG}" \
              "${universal}" "${armv6}" "${armv7}" "${arm64}" "${x86_64}" "${xapk}" \
              release/update.json release/SHA256SUMS --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes-file release/release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              "${universal}" "${armv6}" "${armv7}" "${arm64}" "${x86_64}" "${xapk}" \
              release/update.json release/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_NAME}" \
              --notes-file release/release-notes.md
          fi
          tag_sha="$(gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
            -f sha="${GITHUB_SHA}" -F force=true --jq '.object.sha')"
          if [[ "${tag_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Release tag points to ${tag_sha}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi

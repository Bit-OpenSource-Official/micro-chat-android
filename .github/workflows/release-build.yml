name: OVE.rs Android release

on:
  push:
    branches:
      - "release/**"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build OVE.rs release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          version="${ref#release/}"
          if [[ -z "${version}" || "${version}" == "${ref}" ]]; then
            echo "Expected branch name release/VERSION, got ${ref}" >&2
            exit 1
          fi
          echo "name=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "code=$((100000 + GITHUB_RUN_NUMBER))" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          store_pass="${RELEASE_STORE_PASSWORD:-password}"
          key_alias="${RELEASE_KEY_ALIAS:-micromsg}"
          key_pass="${RELEASE_KEY_PASSWORD:-${store_pass}}"

          if [[ -n "${ANDROID_KEYSTORE_B64}" ]]; then
            printf "%s" "${ANDROID_KEYSTORE_B64}" | base64 -d > micromsg.keystore
          else
            keytool -genkeypair \
              -keystore micromsg.keystore \
              -storepass "${store_pass}" \
              -keypass "${key_pass}" \
              -alias "${key_alias}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=OVE.rs, OU=Android, O=OVE.rs, L=NA, ST=NA, C=US"
          fi

          echo "RELEASE_STORE_FILE=micromsg.keystore" >> "${GITHUB_ENV}"
          echo "RELEASE_STORE_PASSWORD=${store_pass}" >> "${GITHUB_ENV}"
          echo "RELEASE_KEY_ALIAS=${key_alias}" >> "${GITHUB_ENV}"
          echo "RELEASE_KEY_PASSWORD=${key_pass}" >> "${GITHUB_ENV}"

      - name: Run release checks
        run: make release-check

      - name: Build universal and platform APKs
        run: |
          make release-apks \
            VERSION="${{ steps.version.outputs.name }}" \
            VERSION_CODE="${{ steps.version.outputs.code }}" \
            RELEASE_TAG="${{ steps.version.outputs.tag }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ove-rs-${{ steps.version.outputs.name }}-release
          path: |
            release/ove-rs-${{ steps.version.outputs.name }}-universal.apk
            release/ove-rs-${{ steps.version.outputs.name }}-armv6.apk
            release/ove-rs-${{ steps.version.outputs.name }}-armv7.apk
            release/ove-rs-${{ steps.version.outputs.name }}-arm64.apk
            release/update.json
            release/SHA256SUMS
            release/release-notes.md
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: OVE.rs ${{ steps.version.outputs.name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              release/*.apk release/update.json release/SHA256SUMS --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes-file release/release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              release/*.apk release/update.json release/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_NAME}" \
              --notes-file release/release-notes.md
          fi

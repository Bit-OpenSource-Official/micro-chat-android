name: OVE.rs Android release

on:
  push:
    branches:
      - "release/**"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build OVE.rs release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout public mst5-client
        uses: actions/checkout@v4
        with:
          repository: Bit-OpenSource-Official/mst5-client
          ref: main
          path: mst5-client

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          version="${ref#release/}"
          if [[ -z "${version}" || "${version}" == "${ref}" ]]; then
            echo "Expected branch name release/VERSION, got ${ref}" >&2
            exit 1
          fi
          echo "name=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "code=$((100000 + GITHUB_RUN_NUMBER))" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: aarch64-linux-android,armv7-linux-androideabi,arm-linux-androideabi

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"

      - name: Install legacy ARMv6 NDK
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/android-ndk-r14b.zip" \
            https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip
          unzip -q "${RUNNER_TEMP}/android-ndk-r14b.zip" -d "${RUNNER_TEMP}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.3.11579264" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_R14_HOME=${RUNNER_TEMP}/android-ndk-r14b" >> "${GITHUB_ENV}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_B64}" || -z "${RELEASE_STORE_PASSWORD}" || \
                -z "${RELEASE_KEY_ALIAS}" || -z "${RELEASE_KEY_PASSWORD}" ]]; then
            echo "Android release signing secrets are required" >&2
            exit 1
          fi
          printf "%s" "${ANDROID_KEYSTORE_B64}" | base64 -d > micromsg.keystore

          echo "RELEASE_STORE_FILE=micromsg.keystore" >> "${GITHUB_ENV}"
          echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Check and build universal/platform APKs
        run: |
          make native-libs release-check release-apks \
            MST5_CLIENT_DIR=mst5-client \
            VERSION="${{ steps.version.outputs.name }}" \
            VERSION_CODE="${{ steps.version.outputs.code }}" \
            RELEASE_TAG="${{ steps.version.outputs.tag }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ove-rs-${{ steps.version.outputs.name }}-release
          path: |
            release/ove-rs-${{ steps.version.outputs.name }}-universal.apk
            release/ove-rs-${{ steps.version.outputs.name }}-armv6.apk
            release/ove-rs-${{ steps.version.outputs.name }}-armv7.apk
            release/ove-rs-${{ steps.version.outputs.name }}-arm64.apk
            release/update.json
            release/SHA256SUMS
            release/release-notes.md
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: OVE.rs ${{ steps.version.outputs.name }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          universal="release/ove-rs-${RELEASE_VERSION}-universal.apk"
          armv6="release/ove-rs-${RELEASE_VERSION}-armv6.apk"
          armv7="release/ove-rs-${RELEASE_VERSION}-armv7.apk"
          arm64="release/ove-rs-${RELEASE_VERSION}-arm64.apk"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "${universal}" release/update.json release/SHA256SUMS --clobber
            gh release upload "${RELEASE_TAG}" "${armv6}" "${armv7}" "${arm64}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes-file release/release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              "${universal}" release/update.json release/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_NAME}" \
              --notes-file release/release-notes.md
            gh release upload "${RELEASE_TAG}" "${armv6}" "${armv7}" "${arm64}"
          fi
          first_apk="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '[.assets[] | select(.name | endswith(".apk"))][0].name')"
          if [[ "${first_apk}" != "$(basename "${universal}")" ]]; then
            echo "Universal APK must be the first release APK for legacy OTA clients; got ${first_apk}" >&2
            exit 1
          fi

plugins {
    id "com.android.application"
}

def dotenv = [:]
def dotenvPath = System.getenv("ENV_FILE")
def dotenvFile
if (dotenvPath) {
    def candidate = new File(dotenvPath)
    dotenvFile = candidate.isAbsolute() ? candidate : rootProject.file(dotenvPath)
} else {
    dotenvFile = rootProject.file(".env")
}
if (dotenvFile.isFile()) {
    dotenvFile.eachLine("UTF-8") { raw ->
        def line = raw.trim()
        if (line && !line.startsWith("#")) {
            if (line.startsWith("export ")) line = line.substring(7).trim()
            int split = line.indexOf("=")
            if (split > 0) {
                def name = line.substring(0, split).trim()
                def value = line.substring(split + 1).trim()
                if (value.length() >= 2 &&
                    ((value.startsWith("\"") && value.endsWith("\"")) ||
                     (value.startsWith("'") && value.endsWith("'")))) {
                    value = value.substring(1, value.length() - 1)
                }
                dotenv[name] = value
            }
        }
    }
}
// The transport pin is public by definition (it is shipped in every APK).
// Keep the production value in source control so release builds are reproducible
// and cannot silently pick up a stale GitHub Actions secret.
def productionCryptServerPublicKey = "iTUo5Se5Z960wwb0KiM/SqcV2LrvCskFGp3WxsVyOQk="
def cryptServerPublicKey = providers.gradleProperty("cryptServerPublicKeyB64").orNull ?:
    System.getenv("CRYPT_SERVER_PUBLIC_KEY_B64") ?:
    dotenv["CRYPT_SERVER_PUBLIC_KEY_B64"] ?:
    productionCryptServerPublicKey
def appVersionName = providers.gradleProperty("appVersionName").orNull ?:
    System.getenv("APP_VERSION_NAME") ?:
    "0.11.0"
def appVersionCode = (providers.gradleProperty("appVersionCode").orNull ?:
    System.getenv("APP_VERSION_CODE") ?:
    "100110").toInteger()
def mst5NativeAbi = providers.gradleProperty("mst5NativeAbi").orNull ?: "universal"
def includeArmv6OtaTls = providers.gradleProperty("includeArmv6OtaTls").orNull ?:
    (mst5NativeAbi == "universal" || mst5NativeAbi == "armeabi" ? "true" : "false")
def packageMst5AsJniLibs = (providers.gradleProperty("packageMst5AsJniLibs").orNull ?: "false").toBoolean()
def effectiveMinSdk = (providers.gradleProperty("minSdkOverride").orNull ?: "10").toInteger()
def supportedMst5NativeAbis = ["universal", "armeabi", "armeabi-v7a", "arm64-v8a", "x86_64"]
if (!supportedMst5NativeAbis.contains(mst5NativeAbi)) {
    throw new GradleException(
        "Unsupported -Pmst5NativeAbi=${mst5NativeAbi}; expected one of ${supportedMst5NativeAbis.join(', ')}"
    )
}
def generatedMst5Assets = layout.buildDirectory.dir("generated/mst5-assets")
def prepareMst5Assets = tasks.register("prepareMst5Assets", Sync) {
    inputs.property("mst5NativeAbi", mst5NativeAbi)
    inputs.property("packageMst5AsJniLibs", packageMst5AsJniLibs)
    if (mst5NativeAbi == "universal") {
        from("src/main/assets") {
            if (packageMst5AsJniLibs) exclude "mst5-native/**"
            if (!includeArmv6OtaTls.toBoolean()) exclude "armv6-ota-tls/**"
        }
    } else {
        from("src/main/assets") {
            exclude "mst5-native/**"
            exclude "armv6-ota-tls/**"
        }
        from("src/main/assets/mst5-native/${mst5NativeAbi}") {
            into "mst5-native/${mst5NativeAbi}"
        }
    }
    if (includeArmv6OtaTls.toBoolean() && mst5NativeAbi != "universal") {
        from("src/main/assets/armv6-ota-tls") {
            into "armv6-ota-tls"
        }
    }
    into(generatedMst5Assets)
    doFirst {
        def requiredAbis = mst5NativeAbi == "universal" ?
            ["armeabi", "armeabi-v7a", "arm64-v8a", "x86_64"] : [mst5NativeAbi]
        requiredAbis.each { abi ->
            if (!file("src/main/assets/mst5-native/${abi}/libmst5_android.so").isFile()) {
                throw new GradleException("Missing mst5-client library for ${abi}; run make native-libs")
            }
        }
        if (includeArmv6OtaTls.toBoolean()) {
            ["libove_ota_tls.so", "cacert.pem", "manifest.json"].each { name ->
                if (!file("src/main/assets/armv6-ota-tls/${name}").isFile()) {
                    throw new GradleException("Missing ARMv6 OTA TLS asset ${name}; run make armv6-ota-tls")
                }
            }
        }
    }
}
def generatedMst5JniLibs = layout.buildDirectory.dir("generated/mst5-jni-libs")
def prepareMst5JniLibs = tasks.register("prepareMst5JniLibs", Sync) {
    inputs.property("packageMst5AsJniLibs", packageMst5AsJniLibs)
    if (packageMst5AsJniLibs) {
        ["armeabi-v7a", "arm64-v8a", "x86_64"].each { abi ->
            from("src/main/assets/mst5-native/${abi}") { into abi }
        }
    }
    into(generatedMst5JniLibs)
}
def productionGithubRepository = "Bit-OpenSource-Official/micro-chat-android"
def githubRepository = providers.gradleProperty("githubRepository").orNull ?:
    System.getenv("GITHUB_REPOSITORY") ?:
    dotenv["GITHUB_REPOSITORY"] ?:
    productionGithubRepository
def javaString = { value ->
    (value == null ? "" : value).replace("\\", "\\\\").replace("\"", "\\\"")
}
def configuredReleaseStoreFile = providers.gradleProperty("releaseStoreFile").orNull ?:
    System.getenv("RELEASE_STORE_FILE")
def releaseStoreFile = configuredReleaseStoreFile ?
    rootProject.file(configuredReleaseStoreFile) :
    rootProject.file("micromsg.keystore")
def releaseStorePassword = providers.gradleProperty("releaseStorePassword").orNull ?:
    System.getenv("RELEASE_STORE_PASSWORD") ?:
    "password"
def releaseKeyAlias = providers.gradleProperty("releaseKeyAlias").orNull ?:
    System.getenv("RELEASE_KEY_ALIAS") ?:
    "micromsg"
def releaseKeyPassword = providers.gradleProperty("releaseKeyPassword").orNull ?:
    System.getenv("RELEASE_KEY_PASSWORD") ?:
    releaseStorePassword

dependencies {
    implementation "com.google.zxing:core:3.5.4"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

android {
    namespace "ru.e6atb.chat"
    compileSdk 35

    defaultConfig {
        applicationId "ru.e6atb.chat"
        // Support Android from version 2.3.6 (API level 10) upwards.
        minSdk effectiveMinSdk
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField "String", "CRYPT_SERVER_PUBLIC_KEY_B64", "\"${cryptServerPublicKey}\""
        buildConfigField "String", "GITHUB_REPOSITORY", "\"${javaString(githubRepository)}\""
        buildConfigField "boolean", "MST5_PACKAGED_AS_JNI", packageMst5AsJniLibs.toString()
    }

    bundle {
        abi { enableSplit = true }
        density { enableSplit = true }
        language { enableSplit = false }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.assets.setSrcDirs([generatedMst5Assets.get().asFile])
        main.jniLibs.setSrcDirs([generatedMst5JniLibs.get().asFile])
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // ---------------------------------------------------------------------
    // Signing configuration for release builds.
    // CI and local release builds use `micromsg.keystore` in this repository root.
    // ---------------------------------------------------------------------
    signingConfigs {
        release {
            storeFile releaseStoreFile
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

tasks.configureEach { task ->
    if (task.name.matches("merge.*Assets") || task.name.toLowerCase().contains("lint")) {
        task.dependsOn(prepareMst5Assets)
    }
    if (task.name.matches("merge.*JniLibFolders") || task.name.toLowerCase().contains("lint")) {
        task.dependsOn(prepareMst5JniLibs)
    }
}

gradle.taskGraph.whenReady { graph ->
    boolean releaseRequested = graph.allTasks.any {
        it.project == project && it.name.toLowerCase().contains("release")
    }
    if (releaseRequested && cryptServerPublicKey.trim().isEmpty()) {
        throw new GradleException(
            "Release build requires -PcryptServerPublicKeyB64=<server public key>"
        )
    }
    if (releaseRequested && !releaseStoreFile.isFile()) {
        throw new GradleException(
            "Release build requires micromsg.keystore in the repository root or -PreleaseStoreFile=<path>"
        )
    }
}
